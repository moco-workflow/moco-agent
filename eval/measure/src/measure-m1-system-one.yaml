# yaml-language-server: $schema=../../../../moco-devkit/moco-workflow-dev/skills/moco-developing-workflows/workflowspec_schema.json
# ================================================================================
# M1 — typesafe.system_one latency by question count (plan-00a step 8, design §19)
# ================================================================================
#
# Decides: the tool/source/memory pre-filter sizes (§6.9.8, §6.4.5), whether
# qset.route must be split (open question 1), and classifier.timeout_sec (§6.2.3).
#
# For each question count in `counts`, `repeats` calls with that many `noul`
# questions (each with instructions -- Laya requires them) over one fixed state.
# The first call per count is reported as `cold_ms`; the rest are the warm
# distribution. Run once per backend:
#
#   moco run agent-harness-measure/measure-m1-system-one --tier dev \
#     -i '{"backend": "typesafe-hosted"}'
#   moco run agent-harness-measure/measure-m1-system-one --tier dev \
#     -i '{"backend": "laya", "base_url": "...", "model": "..."}'
#
# Questions are built with sorted, zero-padded keys: Temporal serialises activity
# input with sorted keys and in-memory runs do not, so an unsorted qset would
# measure two different requests (see CLAUDE.md, "qsets must sort").
#
# Times are workflow time (now() before and after the activity), which on Temporal
# advances with the activity-completed event: it includes scheduling overhead,
# which is what a turn actually pays.
# ================================================================================

header:
  schema_version: 2.0.0
  workflow_name: measure-m1-system-one

context:
  state_text: >-
    Current message: how do I make a moco workflow retry an HTTP activity three times with exponential backoff, and can I see the attempts in the trace?
  topics: ["retries", "HTTP activities", "tracing", "state machines", "Kafka", "SQL", "email", "Kubernetes", "secrets", "scheduling", "child workflows", "expressions", "testing", "deployment", "authentication", "rules engines", "Google Drive", "OpenAI calls", "MCP tools", "timers", "events", "iteration", "parallelism", "abort handling", "continue-as-new", "the UI", "the CLI", "namespaces", "versioning", "persist state"]
  rows: []
  m1_result: {}

input:
  backend: typesafe-hosted
  counts: [1, 5, 10, 20, 30]
  repeats: 5
  # null = the worker's TYPESAFE_* environment.
  model:
  base_url:
  apikey_secret_key:

output: '{{ m1_result }}'

functions:
  timed-system-one:
    input:
      state_text:
      questions:
      model:
      base_url:
      apikey_secret_key:
    output:
      ms: "{{ ms }}"
      answered: "{{ answered }}"
    main:
      tasks:
        - task_name: t0
          set:
            - started: "{{ now() }}"
        - task_name: classify
          activity:
            type: typesafe.system_one
            input:
              state: "{{ state_text }}"
              questions: "{{ questions }}"
              model: "{{ model }}"
              base_url: "{{ base_url }}"
              apikey_secret_key: "{{ apikey_secret_key }}"
            options:
              retry_policy:
                timeout_sec: 120
                max_attempts: 1
          output:
            set:
              - answered: "{{ len((_ or {}).get('nouls') or {}) }}"
        - task_name: t1
          set:
            - ms: "{{ int((now() - started).total_seconds() * 1000) }}"

main:
  tasks:
    - task_name: plan-runs
      set:
        - runs: "{{ [{'n': n, 'run': r} for n in counts for r in range(int(repeats))] }}"

    - task_name: run-all
      loop:
        in: "{{ runs }}"
        foreach: run
        do:
          tasks:
            - task_name: build-qset
              set:
                - questions: >-
                    {{ {('q%02d' % i): {'type': 'noul',
                                       'instructions': 'Is the current message about '
                                                       + topics[i % len(topics)] + '?'}
                        for i in range(run['n'])} }}
            # on_error: one failed call is a data point, not the end of the
            # measurement.
            - task_name: timed-call
              workflow:
                function: timed-system-one
                input:
                  state_text: "{{ state_text }}"
                  questions: "{{ questions }}"
                  model: "{{ model }}"
                  base_url: "{{ base_url }}"
                  apikey_secret_key: "{{ apikey_secret_key }}"
              output:
                set:
                  - row#: >-
                      {{ {'n': run['n'], 'run': run['run'], 'ms': _.get('ms'),
                          'ok': _.get('answered') == run['n'], 'error': None} }}
                data:
                  row: '{{ row }}'
              on_error:
                catch: true
                do:
                  set:
                    - row#: >-
                        {{ {'n': run['n'], 'run': run['run'], 'ms': None, 'ok': False,
                            'error': (_.get('error_message') or '')[:200]} }}
      output:
        as: rows
    - task_name: summarise
      set:
        # A loop over a `tasks` body collects, per item, the list of each
        # task's result; the row is the last task's.
        - _rows: >-
            {{ [r[-1]['row'] for r in (rows or [])
                if isinstance(r, list) and r and isinstance(r[-1], dict) and r[-1].get('row')] }}
        - m1_result:
            measurement: M1
            backend: "{{ backend }}"
            model: "{{ model }}"
            by_count: >-
              {{ [(lambda warm, all_: {
                     'n': n,
                     'calls': len(all_),
                     'failed': len([r for r in all_ if not r['ok']]),
                     'cold_ms': (all_[0]['ms'] if all_ and all_[0]['ok'] else None),
                     'warm_p50_ms': (warm[len(warm) // 2] if warm else None),
                     'warm_p90_ms': (warm[min(len(warm) - 1, int(len(warm) * 0.9))] if warm else None),
                     'warm_max_ms': (warm[-1] if warm else None)})(
                    sorted(r['ms'] for r in _rows if r['n'] == n and r['run'] > 0 and r['ok']),
                    sorted([r for r in _rows if r['n'] == n], key=lambda r: r['run']))
                  for n in counts] }}
            rows: "{{ _rows }}"
