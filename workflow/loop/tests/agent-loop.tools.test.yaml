test_type: integration-test

# agent-loop with tools (plan-11 steps 9-15, design §6.8.3): a round trip, max steps
# → answering, the per-step call cap, suspend for approval / a user reply (F20),
# resume approve / reject / re-suspend / tool gone, and the grounding rule
# tool_results. Policy, selector, executor and the model are mocked by task name.
# A mock value is an expression evaluated where the task runs, so `think-step`
# answers by `step`: a tool call at step 0, the answer after it.

wfspec:
  name: agent-loop

test_data:
  react: &react
    name: react
    kind: loop
    loop: {model_role: inference, prompt: loop, retrieval: {when: none}, tools: {toolsets: from_definition, max_selected: 6}, max_steps: 3, output_checks: [], grounding: tool_results}
  react_async: &react_async
    name: react
    kind: loop
    loop: {model_role: inference, prompt: loop, retrieval: {when: none}, tools: {toolsets: from_definition, max_selected: 6}, max_steps: 3, output_checks: [], grounding: tool_results, async_tools: true}
  config: &config {toolsets: [k8s], decisions: {guard: {grounded_min_p: 0.5}}}
  pods: &pods {name: k8s_pods, version: 3, status: enabled, effective_permission: auto, description: List pods, parameters: {type: object, properties: {namespace: {type: string}}}}
  scale: &scale {name: k8s_scale, version: 1, status: enabled, effective_permission: approve, description: Scale, parameters: {type: object, properties: {}}}
  ask: &ask {name: ask_user, version: 1, status: enabled, effective_permission: auto, description: Ask, parameters: {type: object, properties: {question: {type: string}}}}
  policy: &policy {ok: true, data: {offerable: [*pods, *scale, *ask], always_offer: [], needs_credential: [], hidden: []}}
  selection: &selection {ok: true, data: {selected: [k8s_pods, k8s_scale, ask_user], openai_tools: [{type: function, function: {name: k8s_pods, parameters: {}}}], decided_by: prefilter}}
  pods_ok: &pods_ok {ok: true, data: {status: ok, content: '["web-1"]', sources: [{title: pods, url: "k8s://staging"}], audit: {tool: k8s_pods, status: ok, version: 3}}}
  scale_pending: &scale_pending
    ok: true
    data:
      status: needs_approval
      content: ""
      sources: []
      pending: {kind: tool_call, summary: "Scale web to 3?", detail: {call: {id: c1, name: k8s_scale, arguments: {name: web}}, args_hash: abc, call_version: 1}, offer_session_grant: true}
      audit: {tool: k8s_scale, status: needs_approval, version: 1}
  held: &held
    id: pa_0123456789abcdef
    kind: tool_call
    summary: "Scale web to 3?"
    detail:
      call: {id: c1, name: k8s_scale, arguments: {name: web}}
      args_hash: abc
      call_version: 1
      step: 1
      messages:
        - {role: assistant, content: null, tool_calls: [{id: c1, type: function, function: {name: k8s_scale, arguments: "{\"name\": \"web\"}"}}]}
      tools: {selected: [k8s_scale], openai_tools: [{type: function, function: {name: k8s_scale, parameters: {}}}]}
      completed_calls: []

test_cases:

  - id: one-tool-round-trip-then-an-answer-grounded-in-tool-results
    input: {agent_id: ops, session_id: s1, turn: 3, profile: *react, query: "list pods in staging", config: *config, budget_sec: 60}
    mocks:
      - {step_name: resolve-tools, _: *policy}
      - {step_name: select-tools, _: *selection}
      - step_name: think-step
        _: >-
          {{ {'ok': True, 'data': {'content': '', 'tool_calls': [{'id': 'c1', 'type': 'function', 'function': {'name': 'k8s_pods', 'arguments': '{"namespace": "staging"}'}}], 'usage': {'calls': 1}}}
             if step == 0 else
             {'ok': True, 'data': {'content': 'There is one pod: web-1.', 'tool_calls': [], 'usage': {'calls': 1}}} }}
      - {step_name: execute-call, _: *pods_ok}
    expect:
      output:
        - status: ok
        - answer: "There is one pod: web-1."
        - grounded: true
        - sources: [{title: pods, url: "k8s://staging"}]
        - pending_action: null
      assert:
        - "{{ usage['llm_calls'] == 2 and usage['tool_calls'] == 1 and trace['tool_audit'] == [{'tool': 'k8s_pods', 'status': 'ok', 'version': 3}] }}"
        - "{{ [s['state'] for s in trace['steps']] == ['selecting', 'thinking', 'acting', 'thinking', 'checking'] }}"

  - id: max-steps-forces-a-final-answer-without-tools
    input: {agent_id: ops, session_id: s1, turn: 3, profile: *react, query: "loop forever", config: *config, budget_sec: 60}
    mocks:
      - {step_name: resolve-tools, _: *policy}
      - {step_name: select-tools, _: *selection}
      - step_name: think-step
        _: {ok: true, data: {content: "still looking", tool_calls: [{id: c1, type: function, function: {name: k8s_pods, arguments: "{}"}}]}}
      - {step_name: execute-call, _: *pods_ok}
      - {step_name: invoke-final, _: {ok: true, data: {content: "Here is what I found so far."}}}
    expect:
      output:
        - status: ok
        - answer: "Here is what I found so far."
      assert:
        - "{{ len(trace['tool_audit']) == 3 and trace['steps'][-2] == {'state': 'answering', 'step': 3, 'fallback': False} }}"

  - id: a-failed-final-call-falls-back-to-the-last-text
    input: {agent_id: ops, session_id: s1, turn: 3, profile: *react, query: "x", config: *config, budget_sec: 60}
    mocks:
      - {step_name: resolve-tools, _: *policy}
      - {step_name: select-tools, _: *selection}
      - step_name: think-step
        _: {ok: true, data: {content: "partial findings", tool_calls: [{id: c1, type: function, function: {name: k8s_pods, arguments: "{}"}}]}}
      - {step_name: execute-call, _: *pods_ok}
      - {step_name: invoke-final, _: {ok: false, error: {code: timeout, message: slow}}}
    expect:
      output:
        - answer: "partial findings"

  - id: little-time-left-goes-straight-to-answering
    input: {agent_id: ops, session_id: s1, turn: 3, profile: *react, query: "x", config: *config, budget_sec: 10}
    mocks:
      - {step_name: resolve-tools, _: *policy}
      - {step_name: select-tools, _: *selection}
      - {step_name: think-step, _: "{{ 1 / 0 }}"}
      - {step_name: invoke-final, _: {ok: false, error: {code: timeout, message: slow}}}
    expect:
      output:
        - status: ok
        - answer: "I ran out of time before I could finish this. Please try again, or ask a narrower question."

  - id: at-most-four-calls-per-step
    input: {agent_id: ops, session_id: s1, turn: 3, profile: *react, query: "x", config: *config, budget_sec: 60}
    mocks:
      - {step_name: resolve-tools, _: *policy}
      - {step_name: select-tools, _: *selection}
      - step_name: think-step
        _: >-
          {{ {'ok': True, 'data': {'content': '', 'tool_calls': [{'id': 'c' + str(i), 'type': 'function', 'function': {'name': 'k8s_pods', 'arguments': '{}'}} for i in range(5)]}}
             if step == 0 else {'ok': True, 'data': {'content': 'done', 'tool_calls': []}} }}
      - {step_name: execute-call, _: *pods_ok}
    expect:
      assert:
        - "{{ len(trace['tool_audit']) == 4 and trace['steps'][2]['dropped'] == ['k8s_pods'] }}"

  - id: an-unknown-tool-is-an-error-result-and-the-loop-goes-on
    input: {agent_id: ops, session_id: s1, turn: 3, profile: *react, query: "x", config: *config, budget_sec: 60}
    mocks:
      - {step_name: resolve-tools, _: *policy}
      - {step_name: select-tools, _: *selection}
      - step_name: think-step
        _: >-
          {{ {'ok': True, 'data': {'content': '', 'tool_calls': [{'id': 'c1', 'type': 'function', 'function': {'name': 'rm_rf', 'arguments': '{}'}}]}}
             if step == 0 else {'ok': True, 'data': {'content': 'sorry', 'tool_calls': []}} }}
      - {step_name: execute-call, _: "{{ 1 / 0 }}"}
    expect:
      assert:
        - "{{ status == 'ok' and grounded == False and trace['tool_audit'][0]['error']['code'] == 'unknown_tool' }}"

  - id: an-approval-suspends-with-a-well-formed-pending-action
    input: {agent_id: ops, session_id: s1, turn: 3, profile: *react, query: "scale web to 3", config: {toolsets: [k8s], hitl: {approval_timeout_sec: 3600}}, budget_sec: 60}
    mocks:
      - step_name: resolve-tools
        _: {ok: true, data: {offerable: [*pods, *scale], always_offer: [], needs_credential: [{name: jira_search, connect_hint: "store JIRA_TOKEN"}], hidden: []}}
      - {step_name: select-tools, _: *selection}
      - step_name: think-step
        _: {ok: true, data: {content: "", tool_calls: [{id: c1, type: function, function: {name: k8s_scale, arguments: "{\"name\": \"web\"}"}}]}}
      - {step_name: execute-call, _: *scale_pending}
    expect:
      output:
        - status: needs_approval
      assert:
        - "{{ 'id' not in pending_action and pending_action['kind'] == 'tool_call' and pending_action['summary'] == 'Scale web to 3?' }}"
        - "{{ pending_action['offer_session_grant'] == True and pending_action['expires_in_sec'] == 3600 and pending_action['detail']['step'] == 1 }}"
        - "{{ pending_action['detail']['args_hash'] == 'abc' and pending_action['detail']['tools']['selected'] == ['k8s_pods', 'k8s_scale', 'ask_user'] }}"
        - "{{ pending_action['detail']['messages'][0]['role'] == 'system' and 'store JIRA_TOKEN' in pending_action['detail']['messages'][0]['content'] }}"
        - "{{ pending_action['detail']['messages'][-1]['role'] == 'assistant' and pending_action['detail']['messages'][-1]['tool_calls'][0]['id'] == 'c1' }}"
        - "{{ trace['tool_audit'] == [{'tool': 'k8s_scale', 'status': 'needs_approval', 'version': 1}] and usage['tool_calls'] == 0 }}"

  - id: ask-user-wins-over-an-approval-in-the-same-step
    input: {agent_id: ops, session_id: s1, turn: 3, profile: *react, query: "scale it", config: *config, budget_sec: 60}
    mocks:
      - {step_name: resolve-tools, _: *policy}
      - {step_name: select-tools, _: *selection}
      - step_name: think-step
        _: {ok: true, data: {content: "", tool_calls: [{id: c1, type: function, function: {name: k8s_scale, arguments: "{}"}}, {id: c2, type: function, function: {name: ask_user, arguments: "{\"question\": \"Which deployment?\"}"}}]}}
      - step_name: execute-call
        _: >-
          {{ {'ok': True, 'data': {'status': 'needs_input', 'content': '', 'pending': {'kind': 'user_input', 'summary': 'Which deployment?', 'detail': {'call': {'id': 'c2', 'name': 'ask_user', 'arguments': {}}, 'args_hash': 'q'}}, 'audit': {'tool': 'ask_user', 'status': 'needs_input'}}}
             if tool_call['name'] == 'ask_user' else
             {'ok': True, 'data': {'status': 'needs_approval', 'content': '', 'pending': {'kind': 'tool_call', 'summary': 's', 'detail': {}}, 'audit': {'tool': 'k8s_scale', 'status': 'needs_approval'}}} }}
    expect:
      assert:
        - "{{ status == 'needs_approval' and pending_action['kind'] == 'user_input' and pending_action['summary'] == 'Which deployment?' }}"
        - "{{ trace['steps'][-1]['held'] == 'ask_user' }}"

  - id: no-offerable-tool-runs-one-plain-step
    input: {agent_id: ops, session_id: s1, turn: 3, profile: *react, query: "hello", config: *config, budget_sec: 60}
    mocks:
      - {step_name: resolve-tools, _: {ok: true, data: {offerable: [], always_offer: [], needs_credential: [], hidden: [{name: k8s_pods, reason: guest_side_effects}]}}}
      - {step_name: select-tools, _: "{{ 1 / 0 }}"}
      - {step_name: think-step, _: {ok: true, data: {content: "Hi!", tool_calls: []}}}
    expect:
      output:
        - status: ok
        - answer: "Hi!"
        - grounded: false

  # ── resume ──────────────────────────────────────────────────────────────
  - id: resume-approve-runs-the-held-call-and-continues
    input: {agent_id: ops, session_id: s1, turn: 4, profile: *react, query: "scale web to 3", config: *config, budget_sec: 60, resume: {pending_action: *held, decision: approve, approval_token: "pa_0123456789abcdef:abc"}}
    mocks:
      - {step_name: resolve-tools-on-resume, _: *policy}
      - step_name: run-held-call
        _: {ok: true, data: {status: ok, content: "scaled", sources: [], audit: {tool: k8s_scale, status: ok, version: 1, approved_by: u1}}}
      - {step_name: think-step, _: {ok: true, data: {content: "Done: web now has 3 replicas.", tool_calls: []}}}
      - {step_name: resolve-tools, _: "{{ 1 / 0 }}"}
    expect:
      output:
        - status: ok
        - answer: "Done: web now has 3 replicas."
        - grounded: true
      assert:
        - "{{ trace['tool_audit'] == [{'tool': 'k8s_scale', 'status': 'ok', 'version': 1, 'approved_by': 'u1'}] }}"
        - "{{ trace['steps'][0] == {'state': 'resuming', 'decision': 'approve', 'kind': 'tool_call', 'tool': 'k8s_scale', 'result': 'ok', 'version_changed': False} }}"

  - id: resume-reject-runs-nothing-and-tells-the-model
    input: {agent_id: ops, session_id: s1, turn: 4, profile: *react, query: "scale web to 3", config: *config, budget_sec: 60, resume: {pending_action: *held, decision: reject, feedback: "not during business hours"}}
    mocks:
      - {step_name: resolve-tools-on-resume, _: *policy}
      - {step_name: run-held-call, _: "{{ 1 / 0 }}"}
      - {step_name: think-step, _: {ok: true, data: {content: "OK, I did not scale it.", tool_calls: []}}}
    expect:
      output:
        - status: ok
        - answer: "OK, I did not scale it."
        - grounded: false
      assert:
        - "{{ trace['steps'][0]['decision'] == 'reject' and trace['steps'][0]['result'] is None }}"

  - id: resume-approve-that-needs-approval-again-re-suspends
    input: {agent_id: ops, session_id: s1, turn: 4, profile: *react, query: "scale", config: *config, budget_sec: 60, resume: {pending_action: *held, decision: approve, approval_token: "pa_0123456789abcdef:abc"}}
    mocks:
      - {step_name: resolve-tools-on-resume, _: *policy}
      - {step_name: run-held-call, _: *scale_pending}
      - {step_name: think-step, _: "{{ 1 / 0 }}"}
    expect:
      output:
        - status: needs_approval
      assert:
        - "{{ pending_action['kind'] == 'tool_call' and pending_action['detail']['step'] == 1 }}"

  - id: resume-approve-for-a-tool-no-longer-offered-is-an-error-result
    input: {agent_id: ops, session_id: s1, turn: 4, profile: *react, query: "scale", config: *config, budget_sec: 60, resume: {pending_action: *held, decision: approve, approval_token: "pa_0123456789abcdef:abc"}}
    mocks:
      - {step_name: resolve-tools-on-resume, _: {ok: true, data: {offerable: [*pods], always_offer: [], needs_credential: [], hidden: []}}}
      - {step_name: run-held-call, _: "{{ 1 / 0 }}"}
      - {step_name: think-step, _: {ok: true, data: {content: "That tool is gone.", tool_calls: []}}}
    expect:
      output:
        - status: ok
        - answer: "That tool is gone."

  - id: resume-a-user-reply-becomes-the-ask-user-result
    input:
      agent_id: ops
      session_id: s1
      turn: 4
      profile: *react
      query: "scale it"
      config: *config
      budget_sec: 60
      resume:
        decision: reply
        feedback: "the web deployment"
        pending_action: {id: pa_1, kind: user_input, summary: "Which deployment?", detail: {call: {id: c2, name: ask_user, arguments: {}}, step: 1, messages: [], tools: {selected: [], openai_tools: []}}}
    mocks:
      - {step_name: resolve-tools-on-resume, _: *policy}
      - {step_name: run-held-call, _: "{{ 1 / 0 }}"}
      - {step_name: think-step, _: {ok: true, data: {content: "Scaling web needs your approval next.", tool_calls: []}}}
    expect:
      output:
        - status: ok

  # Hooks (§5.4): a tool.before block makes the call `denied`; the executor never runs.
  - id: a-tool-before-hook-veto-denies-the-call
    input: {agent_id: ops, session_id: s1, turn: 3, profile: *react, query: "show secret db", config: {toolsets: [k8s], hooks: [{event: tool.before, wfspec: hook.no-secrets}]}, budget_sec: 60}
    mocks:
      - {step_name: resolve-tools, _: *policy}
      - {step_name: select-tools, _: *selection}
      - step_name: think-step
        _: >-
          {{ {'ok': True, 'data': {'content': '', 'tool_calls': [{'id': 'c1', 'type': 'function', 'function': {'name': 'k8s_pods', 'arguments': '{}'}}]}}
             if step == 0 else {'ok': True, 'data': {'content': 'I may not do that.', 'tool_calls': []}} }}
      - {step_name: hook-tool-before, _: {action: block, reason: "no cluster reads today", payload: {}, trace: []}}
      - {step_name: execute-call, _: "{{ 1 / 0 }}"}
    expect:
      assert:
        - "{{ status == 'ok' and trace['tool_audit'][0]['status'] == 'denied' and trace['tool_audit'][0]['error']['code'] == 'hook_blocked' }}"

  # ── async tools (phase 3, §6.9.9) ───────────────────────────────────────
  # The executor mock answers from the loop's own state: async_started only while the
  # loop would allow it (profile flag, no job yet this turn).
  - id: an-async-tool-ends-the-turn-async-started-with-its-job-request
    input: {agent_id: ops, session_id: s1, turn: 3, profile: *react_async, query: "report on staging", config: *config, budget_sec: 60}
    mocks:
      - {step_name: resolve-tools, _: *policy}
      - {step_name: select-tools, _: *selection}
      - step_name: think-step
        _: >-
          {{ {'ok': True, 'data': {'content': '', 'tool_calls': [{'id': 'c1', 'type': 'function', 'function': {'name': 'k8s_pods', 'arguments': '{"namespace": "staging"}'}}], 'usage': {'calls': 1}}}
             if step == 0 else
             {'ok': True, 'data': {'content': 'The report is running; I will post it here.', 'tool_calls': [], 'usage': {'calls': 1}}} }}
      - step_name: execute-call
        _: >-
          {{ {'ok': True, 'data': {'status': 'async_started', 'content': 'started: Pods is running in the background as a job.', 'sources': [],
                                   'job_request': {'wfspec': 'tool-job', 'summary': 'Pods', 'input': {'call': {'id': 'c1'}}},
                                   'audit': {'tool': 'k8s_pods', 'status': 'async_started', 'version': 3}}}
             if loop_cfg.get('async_tools') is True and job_request is None else 1 / 0 }}
    expect:
      output:
        - status: async_started
        - answer: "The report is running; I will post it here."
        - job_request: {wfspec: tool-job, summary: Pods, input: {call: {id: c1}}}
        - pending_action: null

  - id: only-the-first-async-call-of-a-turn-starts-a-job
    input: {agent_id: ops, session_id: s1, turn: 3, profile: *react_async, query: "two reports", config: *config, budget_sec: 60}
    mocks:
      - {step_name: resolve-tools, _: *policy}
      - {step_name: select-tools, _: *selection}
      - step_name: think-step
        _: >-
          {{ {'ok': True, 'data': {'content': '', 'tool_calls': [{'id': 'c1', 'type': 'function', 'function': {'name': 'k8s_pods', 'arguments': '{"namespace": "a"}'}},
                                                                 {'id': 'c2', 'type': 'function', 'function': {'name': 'k8s_pods', 'arguments': '{"namespace": "b"}'}}], 'usage': {'calls': 1}}}
             if step == 0 else
             {'ok': True, 'data': {'content': 'One report started.', 'tool_calls': [], 'usage': {'calls': 1}}} }}
      - step_name: execute-call
        _: >-
          {{ {'ok': True, 'data': {'status': 'async_started', 'content': 'started', 'sources': [],
                                   'job_request': {'wfspec': 'tool-job', 'summary': 'first'}, 'audit': {'tool': 'k8s_pods', 'status': 'async_started'}}}
             if job_request is None else
             {'ok': True, 'data': {'status': 'error', 'content': 'error: unavailable: one job per turn', 'sources': [], 'job_request': None,
                                   'audit': {'tool': 'k8s_pods', 'status': 'error'}}} }}
    expect:
      assert:
        - "{{ status == 'async_started' and job_request == {'wfspec': 'tool-job', 'summary': 'first'} }}"
        - "{{ [a['status'] for a in trace['tool_audit']] == ['async_started', 'error'] }}"

