test_type: unit-test

# check-manifest (plan-10 step 2, design §6.9.3): one case per validate rule. The
# step reads the row as `current` plus the outside facts (package catalogs, global
# secret names). The wfspec's context supplies the constants. Each case spells its
# manifest out in full: the test loader does not resolve YAML merge keys (`<<`), and
# unit-test input is one evaluated map, so its keys cannot build on each other.
# `current#literal` keeps the manifest templates unevaluated.

wfspec:
  name: tool-registry

test_groups:
  - step_name: check-manifest
    test_cases:

      - id: a-valid-manifest-has-no-problems
        input:
          mode: "validate"
          valid: true
          run_checks: true
          cat_harness: {"wfspecs": ["access", "tool.moco-builtin"]}
          global_secrets: ["K8S_TOKEN"]
          current#literal: {"name": "k8s_pods", "description": "List the pods in a namespace.", "parameters": {"type": "object", "properties": {"namespace": {"type": "string"}, "kind": {"type": "string", "enum": ["Pod"]}}, "required": ["namespace"]}, "binding": {"activity": {"type": "k8s.list", "input_template": {"kind": "Pod", "namespace": "{{ args['namespace'] }}"}}}, "result": {"schema": null, "shape": null, "max_chars": 8000, "sources": null}, "credential": {"mode": "none", "secret_key": null}, "policy": {"side_effects": "read", "permission": "auto", "idempotent": true, "allow_session_grant": false, "approval_template": "List pods in {{ args['namespace'] }}?", "limits": {"per_turn": 4, "per_session": 50}}, "execution": {"timeout_sec": 30, "mode": "sync", "retry": {"max_attempts": 1}}, "toolsets": ["k8s-readonly"]}
        expect:
          assert:
            - "{{ manifest_problems == [] }}"

