# yaml-language-server: $schema=../../../../moco-devkit/moco-workflow-dev/skills/moco-developing-workflows/workflowspec_schema.json
# ================================================================================
# PROFILE-AVAILABILITY — which profiles can run for this caller, now (design §6.7.1)
# ================================================================================
#
#   in                                         out
#   ────────────────────────────────────────── ────────────────────────────────────
#   config, profiles, catalog, has_tools?,     {available: [{name, route_description,
#   agent_worker?                                examples, needs_rewrite, requires}],
#                                               unavailable: {name: reason}, role}
#
# The router is never offered a profile that cannot run. `config.profiles` (already
# minus `disabled_profiles`, agent-config) gives the order; each is then dropped when:
#   guest         the caller is a guest and it is not in access.guest_profiles, or it
#                 requires not_guest
#   denied        the caller is denied: nothing is available
#   no_sources    requires.sources and the catalog is empty
#   no_tools      requires.tools and no tool is offerable to this caller (the session
#                 asks tool-policy resolve in preparing)
#   no_worker     requires.worker: agent and the agent worker is not configured
#   config_off    requires.config: <dotted path> is not truthy in config
# The caller's role comes from `access identify`, the same lists `authorize` uses.
# ================================================================================

header:
  schema_version: 2.0.0
  workflow_name: profile-availability

input:
  agent_id:
  config: {}
  profiles: {}
  catalog: []
  has_tools: false
  agent_worker: false

output:
  available: "{{ available }}"
  unavailable: "{{ unavailable }}"
  role: "{{ role }}"

main:
  tasks:
    - task_name: identify-caller
      workflow:
        ref: agent-harness-foundation/access
        mode: inline
        input: {mode: identify, agent_id: "{{ agent_id }}", definition_access: "{{ (config or {}).get('access') }}"}
      output:
        set:
          - role: "{{ ((_ or {}).get('data') or {}).get('role') or 'denied' }}"

    - task_name: check-requires
      set:
        - _guest_ok: "{{ list(((config or {}).get('access') or {}).get('guest_profiles') or []) }}"
        - _order: "{{ [p for p in ((config or {}).get('profiles') or []) if p in (profiles or {})] }}"
        # Dotted lookup into config: "memory.long_term.enabled".
        - _flags: >-
            {{ {p: (lambda path: (lambda f: f(f, config or {}, path.split('.')))(
                      lambda self, d, ks: (self(self, d.get(ks[0]), ks[1:]) if ks and isinstance(d, dict) else (d if not ks else None))))(
                      str(((profiles[p].get('requires') or {}).get('config'))))
                for p in _order if (profiles[p].get('requires') or {}).get('config')} }}
        - _reason: >-
            {{ {p: ('denied' if role == 'denied' else
                    'guest' if role == 'guest' and (p not in _guest_ok or (profiles[p].get('requires') or {}).get('not_guest')) else
                    'no_sources' if (profiles[p].get('requires') or {}).get('sources') and not catalog else
                    'no_tools' if (profiles[p].get('requires') or {}).get('tools') and not has_tools else
                    'no_worker' if (profiles[p].get('requires') or {}).get('worker') == 'agent' and not agent_worker else
                    'config_off' if (profiles[p].get('requires') or {}).get('config') and not _flags.get(p) else None)
                for p in _order} }}
        - available: >-
            {{ [{'name': p,
                 'route_description': profiles[p].get('route_description') or p,
                 'examples': list(profiles[p].get('examples') or []),
                 'needs_rewrite': bool(profiles[p].get('needs_rewrite')),
                 'requires': profiles[p].get('requires') or {}}
                for p in _order if _reason[p] is None] }}
        - unavailable#: "{{ {p: r for p, r in _reason.items() if r is not None} }}"
