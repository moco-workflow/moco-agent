# yaml-language-server: $schema=../../../../moco-devkit/moco-workflow-dev/skills/moco-developing-workflows/workflowspec_schema.json
# ================================================================================
# AGENT-HARNESS-KNOWLEDGE — the package's main wfspec
# ================================================================================
#
# `moco publish` requires a wfspec named after the package. The harness is split
# into agent-harness-* packages so a child workflow loads only its own package
# (the engine fetches a whole package per break-away child); this one says which
# package and version is deployed. `agent-harness` lists the whole set.
# ================================================================================
header:
  schema_version: 2.0.0
  workflow_name: agent-harness-knowledge

context:
  info: {}

output: '{{ info }}'

main:
  task_name: describe
  set:
    - info:
        package: agent-harness-knowledge
        version: "{{ __sys_info__.get('wfspec_version') }}"
